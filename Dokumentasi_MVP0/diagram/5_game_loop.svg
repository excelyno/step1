<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7b8794"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#52606d" stroke-width="1.2"/></marker>
  <marker id="dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#52606d"/></marker>
</defs>
<rect width="1040" height="640" fill="#ffffff"/>
<text x="520" y="32" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="700">Game loop: yang terjadi di SETIAP frame (±60 kali per detik)</text><rect x="370" y="56" width="300" height="64" rx="8" fill="#e3ecfa" stroke="#4a6fa5" stroke-width="1.5"/><text x="520" y="82" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">Timer.Tick  →  GameLoop()</text><text x="520" y="104" font-size="12" fill="#52606d" text-anchor="middle">dt = waktu sejak frame lalu (maks 0,1 dtk)</text><rect x="40" y="160" width="440" height="400" rx="12" fill="#fdf0d5" stroke="#c58b1c" stroke-width="1.5"/><text x="58" y="188" font-size="15" fill="#c58b1c" text-anchor="start" font-weight="700">Game.Update(dt) — LOGIKA</text><rect x="56" y="214" width="408" height="54" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1"/><text x="70" y="235" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">1. Cek tombol F3</text><text x="70" y="256" font-size="12" fill="#52606d" text-anchor="start">WasPressed(F3) → nyalakan / matikan DebugOverlay</text><rect x="56" y="278" width="408" height="54" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1"/><text x="70" y="299" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">2. Niat gerak</text><text x="70" y="320" font-size="12" fill="#52606d" text-anchor="start">Input.GetMoveVector() + IsRunning → Player.SetMovementIntent</text><rect x="56" y="342" width="408" height="54" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1"/><text x="70" y="363" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">3. Update dunia</text><text x="70" y="384" font-size="12" fill="#52606d" text-anchor="start">Farm.Update → tiap objek.Update → Player.Move</text><text x="70" y="390" font-size="13" fill="#1f2933" text-anchor="start"></text><rect x="56" y="396" width="408" height="28" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1" stroke-dasharray="3 3"/><text x="70" y="415" font-size="12" fill="#52606d" text-anchor="start">→ TryMove (X lalu Y) → Location.CanOccupy?</text><rect x="56" y="436" width="408" height="54" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1"/><text x="70" y="457" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">4. Kamera</text><text x="70" y="478" font-size="12" fill="#52606d" text-anchor="start">Camera.Follow (lerp halus) → ClampTo tepi map</text><rect x="56" y="500" width="408" height="54" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1"/><text x="70" y="521" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">5. Akhir frame</text><text x="70" y="542" font-size="12" fill="#52606d" text-anchor="start">Input.EndFrame() → hapus status "baru ditekan"</text><rect x="560" y="160" width="440" height="400" rx="12" fill="#f3e8f8" stroke="#8a4fa3" stroke-width="1.5"/><text x="578" y="188" font-size="15" fill="#8a4fa3" text-anchor="start" font-weight="700">Game.Draw(g) — GAMBAR</text><rect x="576" y="214" width="408" height="54" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1"/><text x="590" y="235" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">a. Bersihkan layar</text><text x="590" y="256" font-size="12" fill="#52606d" text-anchor="start">g.Clear(Black), NearestNeighbor (piksel tajam)</text><rect x="576" y="278" width="408" height="54" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1"/><text x="590" y="299" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">b. Transformasi</text><text x="590" y="320" font-size="12" fill="#52606d" text-anchor="start">Scale ×3 lalu geser −posisi kamera</text><rect x="576" y="342" width="408" height="54" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1"/><text x="590" y="363" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">c. Lapisan 1: tile</text><text x="590" y="384" font-size="12" fill="#52606d" text-anchor="start">TileMap.Draw — hanya tile yang terlihat (culling)</text><rect x="576" y="406" width="408" height="54" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1"/><text x="590" y="427" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">d. Lapisan 2: objek</text><text x="590" y="448" font-size="12" fill="#52606d" text-anchor="start">Urutkan DrawOrder (Y kaki) → obj.Draw (polimorfisme)</text><rect x="576" y="470" width="408" height="54" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1"/><text x="590" y="491" font-size="13.5" fill="#1f2933" text-anchor="start" font-weight="700">e. Debug (kalau F3)</text><text x="590" y="512" font-size="12" fill="#52606d" text-anchor="start">Grid, hitbox merah, panel FPS/posisi/tile</text><path d="M420,120 L420,140 L265,140 L265,160" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M480,520 L560,520" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="520" y="510" font-size="11" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Invalidate()</text><text x="520" y="540" font-size="11" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">→ OnPaint</text><path d="M780,560 L780,600 L1020,600 L1020,88 L670,88" stroke="#7b8794" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1012" y="594" font-size="12" fill="#52606d" text-anchor="end">frame berikutnya</text>
</svg>