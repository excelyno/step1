<text x="500" y="34" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="700">Arsitektur MVP 0: siapa memakai siapa</text><rect x="40" y="60" width="920" height="104" rx="12" fill="#e3ecfa" stroke="#4a6fa5" stroke-width="1.5"/><text x="58" y="86" font-size="15" fill="#4a6fa5" text-anchor="start" font-weight="700">UI — jendela Windows</text><text x="58" y="105" font-size="12" fill="#52606d" text-anchor="start">Menerima event (tombol, paint, fokus) dan menjalankan timer game loop.</text><rect x="58" y="118" width="70" height="32" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.2"/><text x="93" y="139" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Program</text><rect x="136" y="118" width="73.6" height="32" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.2"/><text x="172.8" y="139" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">GameForm</text><rect x="40" y="196" width="920" height="104" rx="12" fill="#fdf0d5" stroke="#c58b1c" stroke-width="1.5"/><text x="58" y="222" font-size="15" fill="#c58b1c" text-anchor="start" font-weight="700">Core — otak game</text><text x="58" y="241" font-size="12" fill="#52606d" text-anchor="start">Menyimpan objek utama dan mengatur urutan Update → Draw tiap frame.</text><rect x="58" y="254" width="70" height="32" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1.2"/><text x="93" y="275" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Game</text><rect x="136" y="254" width="102.4" height="32" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1.2"/><text x="187.2" y="275" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">InputManager</text><rect x="246.4" y="254" width="70" height="32" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1.2"/><text x="281.4" y="275" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Camera</text><rect x="324.4" y="254" width="88" height="32" rx="6" fill="#fff" stroke="#c58b1c" stroke-width="1.2"/><text x="368.4" y="275" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">GameConfig</text><rect x="40" y="332" width="445" height="104" rx="12" fill="#e4f4e4" stroke="#3f8f4f" stroke-width="1.5"/><text x="58" y="358" font-size="15" fill="#3f8f4f" text-anchor="start" font-weight="700">Entities — benda di dunia</text><text x="58" y="377" font-size="12" fill="#52606d" text-anchor="start">Apa saja yang punya posisi dan bisa digambar.</text><rect x="58" y="390" width="88" height="32" rx="6" fill="#fff" stroke="#3f8f4f" stroke-width="1.2"/><text x="102" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">GameObject</text><rect x="154" y="390" width="80.8" height="32" rx="6" fill="#fff" stroke="#3f8f4f" stroke-width="1.2"/><text x="194.4" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Character</text><rect x="242.8" y="390" width="70" height="32" rx="6" fill="#fff" stroke="#3f8f4f" stroke-width="1.2"/><text x="277.8" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Player</text><rect x="320.8" y="390" width="80.8" height="32" rx="6" fill="#fff" stroke="#3f8f4f" stroke-width="1.2"/><text x="361.2" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Direction</text><rect x="505" y="332" width="455" height="104" rx="12" fill="#e6f2f2" stroke="#2f7f86" stroke-width="1.5"/><text x="523" y="358" font-size="15" fill="#2f7f86" text-anchor="start" font-weight="700">World — peta &amp; lokasi</text><text x="523" y="377" font-size="12" fill="#52606d" text-anchor="start">Grid tile, pembaca file map, wasit tabrakan.</text><rect x="523" y="390" width="102.4" height="32" rx="6" fill="#fff" stroke="#2f7f86" stroke-width="1.2"/><text x="574.2" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">GameLocation</text><rect x="633.4" y="390" width="70" height="32" rx="6" fill="#fff" stroke="#2f7f86" stroke-width="1.2"/><text x="668.4" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Farm</text><rect x="711.4" y="390" width="70" height="32" rx="6" fill="#fff" stroke="#2f7f86" stroke-width="1.2"/><text x="746.4" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">TileMap</text><rect x="789.4" y="390" width="70" height="32" rx="6" fill="#fff" stroke="#2f7f86" stroke-width="1.2"/><text x="824.4" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Tile</text><rect x="867.4" y="390" width="80.8" height="32" rx="6" fill="#fff" stroke="#2f7f86" stroke-width="1.2"/><text x="907.8" y="411" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">MapLoader</text><rect x="40" y="468" width="920" height="104" rx="12" fill="#f3e8f8" stroke="#8a4fa3" stroke-width="1.5"/><text x="58" y="494" font-size="15" fill="#8a4fa3" text-anchor="start" font-weight="700">Rendering — cara menggambar</text><text x="58" y="513" font-size="12" fill="#52606d" text-anchor="start">Mengubah data dunia menjadi gambar di layar.</text><rect x="58" y="526" width="73.6" height="32" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1.2"/><text x="94.8" y="547" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">Renderer</text><rect x="139.6" y="526" width="116.8" height="32" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1.2"/><text x="198" y="547" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">IAssetProvider</text><rect x="264.4" y="526" width="138.4" height="32" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1.2"/><text x="333.59999999999997" y="547" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">PlaceholderAssets</text><rect x="410.79999999999995" y="526" width="102.4" height="32" rx="6" fill="#fff" stroke="#8a4fa3" stroke-width="1.2"/><text x="461.99999999999994" y="547" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">DebugOverlay</text><rect x="40" y="604" width="920" height="104" rx="12" fill="#f1f1ef" stroke="#7d7a6d" stroke-width="1.5"/><text x="58" y="630" font-size="15" fill="#7d7a6d" text-anchor="start" font-weight="700">Content &amp; Interfaces — data dan kontrak</text><text x="58" y="649" font-size="12" fill="#52606d" text-anchor="start">File map teks + kontrak yang dipakai bersama.</text><rect x="58" y="662" width="73.6" height="32" rx="6" fill="#fff" stroke="#7d7a6d" stroke-width="1.2"/><text x="94.8" y="683" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">farm.txt</text><rect x="139.6" y="662" width="88" height="32" rx="6" fill="#fff" stroke="#7d7a6d" stroke-width="1.2"/><text x="183.6" y="683" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">IUpdatable</text><rect x="235.6" y="662" width="80.8" height="32" rx="6" fill="#fff" stroke="#7d7a6d" stroke-width="1.2"/><text x="276" y="683" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">IDrawable</text><rect x="324.4" y="662" width="73.6" height="32" rx="6" fill="#fff" stroke="#7d7a6d" stroke-width="1.2"/><text x="361.2" y="683" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">TileType</text><rect x="406" y="662" width="145.6" height="32" rx="6" fill="#fff" stroke="#7d7a6d" stroke-width="1.2"/><text x="478.8" y="683" font-size="12" fill="#1f2933" text-anchor="middle" font-family="Consolas, monospace">MapFormatException</text><path d="M500,164 L500,196" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M262,300 L262,332" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M732,300 L732,332" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M262,436 L262,468" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M732,436 L732,468" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M500,572 L500,604" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="510" y="186" font-size="12" fill="#52606d" text-anchor="start">GameForm memanggil Game.Update() dan Game.Draw()</text><path d="M485,384 L505,384" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arrS)"/><text x="500" y="735" font-size="12" fill="#52606d" text-anchor="middle">Panah = "memakai". Lapisan atas tidak perlu tahu detail lapisan bawah.</text>
