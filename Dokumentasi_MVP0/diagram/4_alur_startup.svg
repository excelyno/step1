<svg xmlns="http://www.w3.org/2000/svg" width="900" height="782" viewBox="0 0 900 782" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
  <marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7b8794"/></marker>
  <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#52606d" stroke-width="1.2"/></marker>
  <marker id="dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto"><path d="M1,5 L7,1 L13,5 L7,9 z" fill="#52606d"/></marker>
</defs>
<rect width="900" height="782" fill="#ffffff"/>
<text x="450" y="32" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="700">Alur saat game dibuka (sekali saja)</text><rect x="60" y="56" width="560" height="58" rx="8" fill="#e3ecfa" stroke="#4a6fa5" stroke-width="1.5"/><text x="76" y="80" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">1.  Program.Main()</text><text x="76" y="101" font-size="12.5" fill="#52606d" text-anchor="start">Titik masuk aplikasi. Membungkus semuanya dengan try/catch.</text><path d="M340,114 L340,136" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="136" width="560" height="58" rx="8" fill="#e3ecfa" stroke="#4a6fa5" stroke-width="1.5"/><text x="76" y="160" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">2.  new GameForm()</text><text x="76" y="181" font-size="12.5" fill="#52606d" text-anchor="start">Membuat jendela 960 × 576, double buffering, timer.</text><path d="M340,194 L340,216" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="216" width="560" height="58" rx="8" fill="#fdf0d5" stroke="#c58b1c" stroke-width="1.5"/><text x="76" y="240" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">3.  new Game(new PlaceholderAssets())</text><text x="76" y="261" font-size="12.5" fill="#52606d" text-anchor="start">Memilih "cara menggambar" (kotak warna) lalu membuat Game.</text><path d="M340,274 L340,296" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="296" width="560" height="58" rx="8" fill="#fdf0d5" stroke="#c58b1c" stroke-width="1.5"/><text x="76" y="320" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">4.  new Renderer(...)  +  new Player("Petani")</text><text x="76" y="341" font-size="12.5" fill="#52606d" text-anchor="start">Penggambar frame dan karakter pemain disiapkan.</text><path d="M340,354 L340,376" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="376" width="560" height="58" rx="8" fill="#e6f2f2" stroke="#2f7f86" stroke-width="1.5"/><text x="76" y="400" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">5.  new Farm()  →  GameLocation(...)</text><text x="76" y="421" font-size="12.5" fill="#52606d" text-anchor="start">Lokasi kebun dibuat; konstruktor induk memuat map.</text><path d="M340,434 L340,456" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="456" width="560" height="58" rx="8" fill="#e6f2f2" stroke="#2f7f86" stroke-width="1.5"/><text x="76" y="480" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">6.  MapLoader.LoadFromFile("farm.txt")</text><text x="76" y="501" font-size="12.5" fill="#52606d" text-anchor="start">Baca teks per huruf → TileType[,] + posisi spawn S.</text><path d="M340,514 L340,536" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="536" width="560" height="58" rx="8" fill="#e6f2f2" stroke="#2f7f86" stroke-width="1.5"/><text x="76" y="560" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">7.  new TileMap(layout, spawn)</text><text x="76" y="581" font-size="12.5" fill="#52606d" text-anchor="start">Grid 30 × 16 objek Tile siap dipakai.</text><path d="M340,594 L340,616" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="616" width="560" height="58" rx="8" fill="#fdf0d5" stroke="#c58b1c" stroke-width="1.5"/><text x="76" y="640" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">8.  ChangeLocation(farm)</text><text x="76" y="661" font-size="12.5" fill="#52606d" text-anchor="start">Player ditaruh di S, dimasukkan ke Farm, kamera langsung ke pemain.</text><path d="M340,674 L340,696" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="60" y="696" width="560" height="58" rx="8" fill="#e3ecfa" stroke="#4a6fa5" stroke-width="1.5"/><text x="76" y="720" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" font-family="Consolas, monospace">9.  GameForm.OnShown()  →  Timer.Start()</text><text x="76" y="741" font-size="12.5" fill="#52606d" text-anchor="start">Jendela tampil, game loop mulai berputar (±60×/detik).</text><path d="M620,485 L700,485" stroke="#d64545" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="660" y="476" font-size="12" fill="#d64545" text-anchor="middle">error</text><rect x="700" y="450" width="180" height="70" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/><text x="790" y="472" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="700" font-family="Consolas, monospace">MapFormatException</text><text x="790" y="490" font-size="12" fill="#52606d" text-anchor="middle">ditangkap Program.Main</text><text x="790" y="507" font-size="12" fill="#52606d" text-anchor="middle">→ MessageBox jelas</text>
</svg>